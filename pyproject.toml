[project]
name = "evtrade"
version = "0.1.0"
description = "evtrade: 策略回测 / 参数扫描 / 行情回放 (PyTorch 统一 CPU/GPU 路径, 基于 VectorizedStrategy + torch 算子)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "evtrade" }]
keywords = ["backtest", "quant", "sweep", "vectorized", "torch", "pytorch", "walk-forward"]

# 运行依赖 (PyTorch 作为统一 array 后端; CPU/CUDA 都在 torch 包内)
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "sqlalchemy>=1.4",
    "pymysql>=1.0",
    "torch>=2.0",
]

# 可选 extra: GPU 协作者显式启用 (RTX 5090 / Blackwell + sm_120 需 cu128+)
# 装法: uv sync --extra gpu
# 默认 uv sync 仍拉 pypi.org CPU wheel (与无 extra 行为一致)
[project.optional-dependencies]
gpu = ["torch==2.9.0+cu128"]

[project.urls]
# 暂无

# torch 仅在启用 gpu extra 时从 cu128 索引解析; 否则走 pypi 默认 (CPU wheel)
# (uv 0.4.7+ PEP 508 sources; list 顺序 = uv 尝试顺序)
[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", extra = "gpu" },
]

# 索引定义: cu128 wheel 来源 (pytorch 官方 cu128 分发)
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
# 不设 explicit=true: 该索引仅在 gpu extra 触发时被使用;
# CPU 默认仍走 pypi (uv 内置隐式索引)

# CLI 入口: uv run evtrade ... 等价于 uv run python -m evtrade
[project.scripts]
evtrade = "evtrade.cli:main"

# 模块入口: uv run python -m evtrade ...
# 由 __main__.py 自动委托给 cli.main, 无需这里写

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evtrade*"]
exclude = ["tests*", "docs*", "kbs*", "scripts*", "tools*", "cache*"]

# 数据文件: 默认参数目录需随包安装走 (虽然默认从仓库读, 但便于离线装)
[tool.setuptools.package-data]
"evtrade.strategies._defaults" = ["*.json"]

# ============ 开发工具配置 ============

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# GPU 测试默认跳过 (需 --gpu 显式开启)
markers = [
    "gpu: 需要 torch CUDA 环境的测试",
]

# ============ uv 工具配置 ============
# uv sync:                   装核心依赖 + CPU torch (默认)
# uv sync --extra gpu:       装核心 + gpu extra (cu128 wheel, 需 RTX 50 / Blackwell 或同等)
# uv run pytest:             跑测试 (默认 CPU; GPU 单测需 --gpu)
# uv run python -m evtrade ...: 启动 CLI
# GPU 协作者一次性:
#   uv sync --extra gpu
# 若 lockfile 重生后回到 CPU wheel, 跑: bash scripts/sync-torch-cu.sh
[tool.uv]
managed = true

# dev 依赖组: uv sync --group dev / uv run --group dev pytest
# (PEP 735, uv 0.4.7+ 推荐写法)
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0; platform_system != 'Windows'",
]
