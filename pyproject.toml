[project]
name = "evtrade"
version = "0.1.0"
description = "evtrade: 策略回测 / 参数扫描 / 行情回放 (PyTorch 统一 CPU/GPU 路径, 基于 VectorizedStrategy + torch 算子)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "evtrade" }]
keywords = ["backtest", "quant", "sweep", "vectorized", "torch", "pytorch", "walk-forward"]

# 运行依赖 (PyTorch 作为统一 array 后端; CPU/CUDA 都在 torch 包内)
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "sqlalchemy>=1.4",
    "pymysql>=1.0",
    "torch>=2.0",
]

# GPU wheel 不通过 pyproject extra 声明:
#   `uv lock` 会把 base 依赖与所有 extras 一起锁进同一份 uv.lock; 若在此声明
#   `gpu = ["torch==2.9.0+cu128"]`, torch 会被 base(`torch>=2.0`)与 gpu extra
#   (`==2.9.0+cu128`)按包名统一塌缩成 cu128, 导致**默认 `uv sync`(CPU 机器)
#   也被迫下载 GPU 版 torch wheel**。
#   因此默认依赖只声明 `torch>=2.0`(pypi CPU wheel); GPU 协作者在 `uv sync`
#   之后跑 `bash scripts/sync-torch-cu.sh`, 由脚本把 venv 内的 torch 覆盖到
#   cu128 wheel(脚本自带探测/幂等/`EVT_TORCH_CU_TAG` 覆写, 与 lockfile 无关)。
#   详见 spec `R: PyTorch 统一后端` + kbs/07 §7.1。

[project.urls]
# 暂无

# CLI 入口: uv run evtrade ... 等价于 uv run python -m evtrade
[project.scripts]
evtrade = "evtrade.cli:main"

# 模块入口: uv run python -m evtrade ...
# 由 __main__.py 自动委托给 cli.main, 无需这里写

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evtrade*"]
exclude = ["tests*", "docs*", "kbs*", "scripts*", "tools*", "cache*"]

# 数据文件: 默认参数目录需随包安装走 (虽然默认从仓库读, 但便于离线装)
[tool.setuptools.package-data]
"evtrade.strategies._defaults" = ["*.json"]

# ============ 开发工具配置 ============

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# GPU 测试默认跳过 (需 --gpu 显式开启)
markers = [
    "gpu: 需要 torch CUDA 环境的测试",
]

# ============ uv 工具配置 ============
# uv sync:                   装核心依赖 + CPU torch (默认; pypi wheel)
# uv run pytest:             跑测试 (默认 CPU; GPU 单测需 --gpu)
# uv run python -m evtrade ...: 启动 CLI
# GPU 协作者 (RTX 50 / Blackwell 或同等): uv sync 之后跑
#   bash scripts/sync-torch-cu.sh    # 把 venv 内 torch 覆盖到 cu128 wheel
[tool.uv]
managed = true

# dev 依赖组: uv sync --group dev / uv run --group dev pytest
# (PEP 735, uv 0.4.7+ 推荐写法)
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0; platform_system != 'Windows'",
]
