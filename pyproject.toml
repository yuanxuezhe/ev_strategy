[project]
name = "evtrade"
version = "0.1.0"
description = "evtrade: 策略回测 / 参数扫描 / 行情回放 (DSL 三端转译: Python + numba + CUDA)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Proprietary" }
authors = [{ name = "evtrade" }]
keywords = ["backtest", "quant", "sweep", "dsl", "numba", "cuda"]

# 运行依赖 (cupy 列为可选 extra, GPU 机器才装)
dependencies = [
    "numpy>=1.20",
    "numba>=0.56",
    "pandas>=1.3",
    "sqlalchemy>=1.4",
    "pymysql>=1.0",
]

[project.optional-dependencies]
# GPU 支持: pip install -e .[gpu] 或 uv sync --extra gpu
gpu = [
    "cupy-cuda12x>=12.0; platform_system == 'Linux'",
    "cupy-cuda11x>=11.0; platform_system != 'Linux'",
]
# 兼容旧环境: 不强制 GPU
all = ["evtrade[gpu]"]

[project.urls]
# 暂无

# CLI 入口: uv run evtrade ... 等价于 uv run python -m evtrade
[project.scripts]
evtrade = "evtrade.cli:main"

# 模块入口: uv run python -m evtrade ...
# 由 __main__.py 自动委托给 cli.main, 无需这里写

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["evtrade*"]
exclude = ["tests*", "docs*", "kbs*", "scripts*", "tools*", "cache*"]

# 数据文件: 默认参数目录需随包安装走 (虽然默认从仓库读, 但便于离线装)
[tool.setuptools.package-data]
"evtrade.strategies._defaults" = ["*.json"]

# ============ 开发工具配置 ============

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# GPU 测试默认跳过 (需 --gpu 显式开启)
markers = [
    "gpu: 需要 cupy/CUDA 环境的测试",
]

# ============ uv 工具配置 ============
# uv sync: 装核心依赖 (CPU 路径)
# uv sync --extra gpu: 加 cupy (Linux CUDA 12 / Windows CUDA 11)
# uv run pytest: 跑测试
# uv run python -m evtrade sweep ...: 启动 CLI
[tool.uv]
managed = true

# dev 依赖组: uv sync --group dev / uv run --group dev pytest
# (PEP 735, uv 0.4.7+ 推荐写法)
[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-xdist>=3.0; platform_system != 'Windows'",
]
